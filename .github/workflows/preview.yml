name: Validate and publish feature preview
on:
  push:
    branches:
      - 'feature/**'
      - '!feature/helper-individual'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm health
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm art:generate
      - run: git diff --exit-code -- public/assets/original
      - run: pnpm exec playwright install msedge
      - run: pnpm test:e2e --workers=1
      - run: pnpm build
      - run: pnpm build:preview
      - run: git diff --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/feature/')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
